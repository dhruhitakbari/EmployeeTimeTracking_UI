<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <!-- Brand/Home Link -->
    <a class="navbar-brand fw-bold" [routerLink]="['/dashboard']">
      <i class="bi bi-clock-history me-2"></i>
      TimeTracker | {{ userRole ? userRole : 'Guest' }}
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <!-- Show these links if the user IS logged in -->
        <ng-container *ngIf="(isLoggedIn$ | async)">
          <li class="nav-item">
            <a class="nav-link" [routerLink]="['/dashboard']">Dashboard</a>
          </li>

          <!-- Admin-Specific Link (Simple Role Check) -->
          <li class="nav-item" *ngIf="userRole === 'Admin'">
            <a class="nav-link" [routerLink]="['/admin/users']">Admin Panel</a>
          </li>

          <!-- Logout Button -->
          <li class="nav-item">
            <button class="btn btn-outline-light ms-md-2" (click)="onLogout()">
              <i class="bi bi-box-arrow-right"></i> Logout
            </button>
          </li>
        </ng-container>

        <!-- Show these links if the user IS NOT logged in -->
        <ng-container *ngIf="!(isLoggedIn$ | async)">
          <li class="nav-item">
            <a class="nav-link" [routerLink]="['/login']">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn btn-secondary text-white ms-md-2" [routerLink]="['/register']">Register</a>
          </li>
        </ng-container>

      </ul>
    </div>
  </div>
</nav>
