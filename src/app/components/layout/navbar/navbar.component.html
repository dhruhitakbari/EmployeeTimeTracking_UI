<header class="app-navbar">

  <!-- LEFT: Page/Brand -->
  <div class="navbar-brand-section">
    <div class="brand-icon">
      <i class="bi bi-clock-history"></i>
    </div>

    <div class="brand-text">
      <div class="brand-title">TimeTracker</div>
      <div class="brand-subtitle">Employee Management</div>
    </div>
  </div>


  <!-- RIGHT SIDE -->
  <div class="navbar-actions">

    <!-- Search -->
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input
        type="text"
        class="form-control"
        placeholder="Search employees, departments..."
      />
    </div>


    <!-- Admin -->
    <button
      type="button"
      class="btn navbar-action-btn"
      *ngIf="(isLoggedIn$ | async) && userRole === 'Admin'">

      <i class="bi bi-grid-1x2 me-2"></i>
      <span>Admin</span>

    </button>


    <!-- Notification -->
    <button
      type="button"
      class="btn navbar-icon-btn"
      *ngIf="isLoggedIn$ | async">

      <i class="bi bi-bell"></i>
      <span class="notification-dot"></span>

    </button>


    <!-- User Avatar -->
    <div
      class="user-avatar"
      *ngIf="isLoggedIn$ | async">

      {{ userRole?.charAt(0) || 'U' }}

    </div>


    <!-- Logout -->
    <button
      type="button"
      class="btn navbar-action-btn"
      *ngIf="isLoggedIn$ | async"
      (click)="onLogout()">

      <i class="bi bi-box-arrow-right me-2"></i>
      <span>Logout</span>

    </button>


    <!-- Login -->
    <a
      *ngIf="!(isLoggedIn$ | async)"
      class="btn navbar-action-btn"
      [routerLink]="['/login']">

      Login

    </a>


    <!-- Register -->
    <a
      *ngIf="!(isLoggedIn$ | async)"
      class="btn navbar-action-btn"
      [routerLink]="['/register']">

      Register

    </a>

  </div>

</header>
