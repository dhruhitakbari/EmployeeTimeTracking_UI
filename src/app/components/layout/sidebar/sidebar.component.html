<!--
  MAIN CONTAINER
  Added (mouseenter) and (mouseleave) to trigger the hover logic
-->
<div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark vh-100 shadow"
       (mouseenter)="onHover(true)"
     (mouseleave)="onHover(false)"
     [style.width.px]="(isCollapsed && !isHovered) ? 80 : 280"
     style="transition: width 0.3s ease-in-out; overflow: hidden; position: relative; z-index: 1050;">

  <!-- 1. HEADER AREA -->
  <div class="d-flex align-items-center mb-4"
       [class.flex-column]="(isCollapsed && !isHovered)"
       [class.justify-content-between]="!(isCollapsed && !isHovered)"
       style="transition: all 0.3s;">

    <!-- Logo (Visible when Expanded OR Hovered) -->
    <a routerLink="/"
       class="d-flex align-items-center text-white text-decoration-none"
       *ngIf="!isCollapsed || isHovered">
      <i class="bi bi-clock-fill fs-4 text-primary"></i>
      <span class="fs-4 fw-bold ms-2" style="white-space: nowrap;">TimeTracker</span>
    </a>

    <!-- Logo Icon Only (Visible when Collapsed AND Not Hovered) -->
    <a routerLink="/"
       class="mb-3 text-white"
       *ngIf="isCollapsed && !isHovered">
       <i class="bi bi-clock-fill fs-2 text-primary"></i>
    </a>

    <!-- THE "PIN CIRCLE" BUTTON -->
    <!-- This button actually toggles the "Pinned" state (isCollapsed) -->
    <button class="btn btn-outline-light rounded-circle d-flex align-items-center justify-content-center p-0 border-0"
            (click)="toggleSidebar()"
            [title]="isCollapsed ? 'Pin Sidebar' : 'Unpin Sidebar'"
            style="width: 32px; height: 32px; background: rgba(255,255,255,0.1);">
      <i class="bi"
         [class.bi-record-circle-fill]="!isCollapsed"
         [class.bi-record-circle]="isCollapsed"
         style="font-size: 1.2rem;"></i>
    </button>
  </div>

  <!-- 2. NAVIGATION LINKS -->
  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item mb-2" *ngFor="let item of menuItems">
      <a [routerLink]="[item.route]"
         class="nav-link text-white d-flex align-items-center"
         [class.justify-content-center]="(isCollapsed && !isHovered)"
         routerLinkActive="active bg-primary"
         [title]="(isCollapsed && !isHovered) ? item.label : ''"
         style="height: 48px; border-radius: 50px; cursor: pointer;">

        <!-- Icon -->
        <i class="bi {{ item.icon }} fs-5"></i>

        <!-- Label (Show if Expanded OR Hovered) -->
        <span class="ms-3" *ngIf="!isCollapsed || isHovered" style="white-space: nowrap;">
          {{ item.label }}
        </span>
      </a>
    </li>
  </ul>

  <hr class="text-white-50">

  <!-- 3. USER PROFILE (Bottom) -->
  <div class="dropdown">
    <a href="#"
       class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
       [class.justify-content-center]="(isCollapsed && !isHovered)"
       id="dropdownUser1"
       data-bs-toggle="dropdown"
       aria-expanded="false">

      <div class="rounded-circle bg-gradient bg-secondary d-flex justify-content-center align-items-center flex-shrink-0"
           style="width: 36px; height: 36px;">
        <i class="bi bi-person-fill fs-5"></i>
      </div>

      <!-- User Info (Show if Expanded OR Hovered) -->
      <div class="ms-2" *ngIf="!isCollapsed || isHovered" style="white-space: nowrap;">
        <div class="fw-bold">{{ currentRole }}</div>
        <small class="text-white-50" style="font-size: 0.75rem;">Online</small>
      </div>
    </a>

    <ul class="dropdown-menu dropdown-menu-dark text-small shadow border-0" aria-labelledby="dropdownUser1">
      <li><a class="dropdown-item" routerLink="/profile"><i class="bi bi-person me-2"></i>Profile</a></li>
      <li><hr class="dropdown-divider border-secondary"></li>
      <li><a class="dropdown-item cursor-pointer text-danger" (click)="onLogout()"><i class="bi bi-box-arrow-right me-2"></i>Sign out</a></li>
    </ul>
  </div>

</div>
