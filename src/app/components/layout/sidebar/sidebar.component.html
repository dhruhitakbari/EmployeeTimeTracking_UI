<div
  class="app-sidebar"
  [class.collapsed]="isCollapsed && !isHovered"
  (mouseenter)="onHover(true)"
  (mouseleave)="onHover(false)"
>

  <!-- ================= HEADER ================= -->

  <div class="sidebar-header">

    <!-- Expanded Logo -->
    <div
      class="brand"
      *ngIf="!isCollapsed || isHovered"
    >

      <div class="brand-icon">
        <i class="pi pi-clock"></i>
      </div>

      <div class="brand-text">

        <div class="brand-name">
          TimeTracker
        </div>

        <div class="brand-subtitle">
          Employee Management
        </div>

      </div>

    </div>


    <!-- Collapsed Logo -->
    <div
      class="brand-collapsed"
      *ngIf="isCollapsed && !isHovered"
    >

      <div class="brand-icon">
        <i class="pi pi-clock"></i>
      </div>

    </div>


    <!-- Pin Button -->
    <button
      pButton
      type="button"
      class="sidebar-pin"
      [icon]="isCollapsed ? 'pi pi-thumbtack' : 'pi pi-thumbtack-fill'"
      [pTooltip]="isCollapsed ? 'Pin Sidebar' : 'Unpin Sidebar'"
      tooltipPosition="right"
      (click)="toggleSidebar()"
    >
    </button>

  </div>


  <!-- ================= NAVIGATION ================= -->

  <div class="sidebar-menu">

    <p-panelMenu
      [model]="menuItems"
      styleClass="custom-panel-menu">
    </p-panelMenu>

  </div>


  <!-- ================= BOTTOM AREA ================= -->

  <div class="sidebar-bottom">

    <!-- Logout -->
    <button
      pButton
      type="button"
      class="logout-button"
      icon="pi pi-sign-out"
      label="Logout"
      (click)="onLogout()"
      *ngIf="!isCollapsed || isHovered"
    >
    </button>


    <!-- Collapsed logout -->
    <button
      pButton
      type="button"
      class="logout-button collapsed-logout"
      icon="pi pi-sign-out"
      pTooltip="Logout"
      tooltipPosition="right"
      (click)="onLogout()"
      *ngIf="isCollapsed && !isHovered"
    >
    </button>


    <!-- User Profile -->
    <div
      class="user-profile"
      [class.justify-content-center]="isCollapsed && !isHovered"
    >

      <p-avatar
        icon="pi pi-user"
        shape="circle"
        size="large"
        styleClass="user-avatar">
      </p-avatar>


      <div
        class="user-info"
        *ngIf="!isCollapsed || isHovered"
      >

        <div class="user-name">
          {{ currentRole }}
        </div>

        <div class="user-status">
          <span class="status-dot"></span>
          Online
        </div>

      </div>

    </div>

  </div>

</div>
