<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-dark text-white text-center rounded-top-4">
          <h2 class="my-2">Employee Time Tracker</h2>
          <p class="mb-0">Sign in to start your session</p>
        </div>
        <div class="card-body p-4">

          <!-- Login Form starts here -->
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <!-- Email Field -->
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input
                type="email"
                id="email"
                formControlName="email"
                class="form-control"
                [ngClass]="{ 'is-invalid': f['email'].invalid && f['email'].touched }"
                placeholder="employee@company.com"
              >
              <div *ngIf="f['email'].invalid && f['email'].touched" class="invalid-feedback">
                <div *ngIf="f['email'].errors?.['required']">Email is required.</div>
                <div *ngIf="f['email'].errors?.['email']">Enter a valid email address.</div>
              </div>
            </div>

            <!-- Password Field -->
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                id="password"
                formControlName="password"
                class="form-control"
                [ngClass]="{ 'is-invalid': f['password'].invalid && f['password'].touched }"
                placeholder="Enter your password"
              >
              <div *ngIf="f['password'].invalid && f['password'].touched" class="invalid-feedback">
                <div *ngIf="f['password'].errors?.['required']">Password is required.</div>
                <div *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters.</div>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid gap-2">
              <button
                type="submit"
                class="btn btn-primary btn-lg rounded-pill"
                [disabled]="loginForm.invalid || loading"
              >
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                {{ loading ? 'Signing In...' : 'Login' }}
              </button>
            </div>
          </form>
          <!-- Login Form ends here -->
        </div>

        <div class="card-footer text-center bg-light border-0 rounded-bottom-4">
          <p class="mb-1">Don't have an account?
            <a [routerLink]="['/register']" class="text-primary fw-bold">Register Now</a>
          </p>
        </div>
      </div>

      <!-- API Reference for debugging -->
      <small class="text-muted d-block text-center mt-3">
        API Endpoint: <code>POST {{ apiBaseUrl }}</code>
      </small>

    </div>
  </div>
</div>
